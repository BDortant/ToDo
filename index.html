<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <!-- Toolbar -->
    <header class="toolbar">
        <h1>ToDo</h1>
        <span id="api-status" class="api-status online" role="status" aria-live="polite" title="Backend online">
            <span class="visually-hidden" id="api-status-label">Backend online</span>
        </span>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="App.importData(event)">
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-section">
            <h2>Views</h2>
            <ul class="view-toggle" id="view-toggle" role="tablist" aria-label="View modes">
                <li role="presentation">
                    <button type="button" class="view-toggle-btn active" data-view="all"
                            role="tab" aria-selected="true" aria-current="page"
                            onclick="App.setView('all')">All items</button>
                </li>
                <li role="presentation">
                    <button type="button" class="view-toggle-btn" data-view="by-project"
                            role="tab" aria-selected="false"
                            onclick="App.setView('by-project')">By project</button>
                </li>
            </ul>
        </div>
        <div class="sidebar-section">
            <h2>Projects</h2>
            <ul class="project-list" id="project-list"></ul>
            <button class="btn btn-primary btn-small" style="margin-top:8px;width:100%" onclick="App.openProjectModal()">+ New Project</button>
        </div>
    </aside>

    <!-- Main content -->
    <main class="main">
        <div class="main-header">
            <h2 id="main-title">All Items</h2>
            <div class="main-header-actions">
                <button class="btn btn-primary" onclick="App.openTodoModal()">+ New To-Do</button>
                <span class="header-divider"></span>
                <button class="btn btn-outline btn-small" onclick="App.cleanup()" title="Remove tasks done more than 1 working day ago">🧹 Cleanup</button>
                <button class="btn btn-outline btn-small" onclick="App.exportData()" title="Export backup">📥 Export</button>
                <button class="btn btn-outline btn-small" onclick="document.getElementById('import-file').click()" title="Import backup">📤 Import</button>
            </div>
        </div>

        <!-- Per-project tabs. Hidden unless a real project is selected —
             "All items", "By project" and "No Project" have no weekly
             update, because the client mail is always per project. -->
        <div class="project-tabs" id="project-tabs" role="tablist" aria-label="Project tabs" hidden>
            <button type="button" id="project-tab-list" class="project-tab active" data-tab="list"
                    role="tab" aria-selected="true" aria-controls="main-content"
                    onclick="App.setProjectTab('list')">List</button>
            <button type="button" id="project-tab-weekly" class="project-tab" data-tab="weekly"
                    role="tab" aria-selected="false" aria-controls="main-content"
                    onclick="App.setProjectTab('weekly')">Weekly update</button>
        </div>

        <!-- Per-column Status / Effort filters now live in the table header
             popovers (built by app.js), so the top filter bar carries only
             the controls that aren't expressible per-column:
              - global cross-field search
              - hide-done one-click
              - daily view (open + done-since-last-working-day) -->
        <div class="filters-bar">
            <input type="text" id="filter-search" placeholder="Search…" oninput="App.render()">
            <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;margin-left:8px">
                <input type="checkbox" id="filter-hide-done" onchange="App.toggleFilter('hide-done')"> Hide done
            </label>
            <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;margin-left:8px">
                <input type="checkbox" id="filter-daily" onchange="App.toggleFilter('daily')"> Daily
            </label>
        </div>

        <!-- Both tabs swap this same container, so it is one panel whose
             label follows the selected tab (kept in sync in App.render).
             role/aria-labelledby are only set while the tabs are shown. -->
        <div id="main-content"></div>
    </main>
</div>

<!-- Todo Modal -->
<div class="modal-backdrop" id="todo-modal">
    <div class="modal">
        <h3 id="todo-modal-title">New To-Do</h3>
        <form onsubmit="App.saveTodo(event)">
            <input type="hidden" id="todo-id">

            <div class="form-group">
                <label>Title *</label>
                <input type="text" id="todo-title" required>
            </div>

            <div class="form-group">
                <label class="recurring-toggle">
                    <input type="checkbox" id="todo-recurring" onchange="App.toggleRecurring()">
                    Recurring
                </label>
                <div class="recurring-section" id="recurring-section">
                    <div class="recurring-interval">
                        <span>Every</span>
                        <input type="number" id="recurring-weeks" min="1" value="1">
                        <span>week(s)</span>
                    </div>
                    <div class="recurring-days" id="recurring-days">
                        <label><input type="checkbox" value="0"> Mon</label>
                        <label><input type="checkbox" value="1"> Tue</label>
                        <label><input type="checkbox" value="2"> Wed</label>
                        <label><input type="checkbox" value="3"> Thu</label>
                        <label><input type="checkbox" value="4"> Fri</label>
                        <label><input type="checkbox" value="5"> Sat</label>
                        <label><input type="checkbox" value="6"> Sun</label>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Project</label>
                    <select id="todo-project"></select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="todo-status">
                        <option>To Do</option>
                        <option>In Progress</option>
                        <option>Waiting on Client</option>
                        <option>Waiting on Me</option>
                        <option>Waiting on Third Party</option>
                        <option>On Hold</option>
                        <option>In Review</option>
                        <option>Done</option>
                        <option>Cancelled</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Effort</label>
                    <select id="todo-effort">
                        <option value="">—</option>
                        <option value="small">Small</option>
                        <option value="medium">Medium</option>
                        <option value="large">Large</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Deadline</label>
                    <input type="date" id="todo-deadline">
                </div>
                <div class="form-group">
                    <label>Assignee</label>
                    <input type="text" id="todo-assignee">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="todo-snooze-until">Snooze until (optional)</label>
                    <input type="date" id="todo-snooze-until" aria-describedby="todo-snooze-until-help">
                    <small id="todo-snooze-until-help" style="color:#888;font-size:11px">Hides from Today/Now until this date.</small>
                </div>
            </div>

            <div class="form-group">
                <label>Tags</label>
                <div class="tags-container" id="tags-container" onclick="document.getElementById('tags-input').focus()">
                    <input type="text" class="tags-input" id="tags-input" placeholder="Type and press Enter">
                </div>
            </div>

            <div class="form-group">
                <label>Notes</label>
                <textarea id="todo-notes"></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="App.closeTodoModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Project Modal -->
<div class="modal-backdrop" id="project-modal">
    <div class="modal">
        <h3 id="project-modal-title">New Project</h3>
        <form onsubmit="App.saveProject(event)">
            <input type="hidden" id="project-id">
            <div class="form-group">
                <label>Project Name *</label>
                <input type="text" id="project-name" required>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="App.closeProjectModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Archived weekly update (read-only) -->
<div class="modal-backdrop" id="weekly-archive-modal">
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="weekly-archive-title">
        <h3 id="weekly-archive-title">Archived update</h3>
        <div class="weekly-archive-body">
            <div id="weekly-archive-preview" class="weekly-preview"></div>
            <details>
                <summary>Markdown source</summary>
                <textarea id="weekly-archive-source" class="weekly-editor" readonly></textarea>
            </details>
        </div>
        <div class="form-actions">
            <button type="button" class="btn btn-outline btn-small" id="weekly-archive-delete"
                    onclick="Weekly.deleteArchive(this)" title="Delete this archived version">🗑️ Delete</button>
            <button type="button" class="btn btn-secondary" onclick="Weekly.closeArchive()">Close</button>
        </div>
    </div>
</div>

<!-- marked is vendored, not CDN-loaded: this app has to work offline. -->
<script src="vendor/marked.min.js"></script>
<!-- weekly.js configures marked (line breaks + raw-HTML escaping) on load. -->
<script src="weekly.js"></script>
<script src="app.js"></script>

</body>
</html>
